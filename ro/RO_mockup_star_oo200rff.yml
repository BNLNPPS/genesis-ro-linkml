    owner: "TPC Calibration Team (STAR)"
    objective: "Produce validated TPC gain/pedestal correction constants for reconstruction of the O+O 200 GeV RFF dataset."
    method_summary: >-
      Standard STAR TPC pedestal/gain calibration procedure applied to
      dedicated calibration-trigger runs; results cross-checked against
      the prior run period's calibration set.
    published_as: []
    uses:
      - identifier: {type: local, value: "RAW-OO200RFF-2021"}
        role: "calibration-trigger runs within the raw stream"
        confidence: "inferred"
        evidence: >-
          DS-001 states only that TPC calibration was performed and
          applied during reconstruction; modeling the derivation as a
          discrete upstream Analysis with its own dedicated inputs is
          this mockup's own elaboration, not stated in DS-001.
      - identifier: {type: url, value: "https://github.com/star-bnl/star-sw"}
        role: "calibration fitting code"
        confidence: "inferred"
        evidence: >-
          The STAR offline framework (SL21c) is documented as used for
          reconstruction; its use for calibration derivation specifically
          is assumed by convention, not separately stated in DS-001.
    used_by: []
    produces:
      - identifier: {type: local, value: "CAL-TPC-GAINPED-OO200RFF-2021-v1"}
        confidence: "documented"
        evidence: >-
          DS-001 validation_methods: TPC calibration (space-charge,
          gain-length corrections) performed separately for RFF and FF
          field polarities and applied during SL21c reconstruction.
        status: >-
          Terminology note: DS-001 names this "space-charge, gain-length
          corrections"; this graph labels the object gain/pedestal (see
          the calibration_type comment on CAL-TPC-GAINPED-OO200RFF-2021-v1
          below).
    produced_by: null   # originating process, not itself produced by another research object

