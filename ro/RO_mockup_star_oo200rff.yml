    name: "TPC gain & pedestal calibration constants, O+O 200 GeV RFF, v1"
    description: >-
      Frozen, serialized extract of per-pad TPC gain and pedestal
      correction constants resolved for the O+O 200 GeV RFF run period.
      No live conditions-database dependency -- which run range this
      applies to was resolved by ANA-TPC-CAL-OO200RFF-2021, not declared
      as a property of this record (see RO.yml's note on why Calibration
      carries no interval_of_validity field).
    version: "1.0"
    status: "Complete"
    created_date: "2021-05-22"
    updated_date: "2021-05-22"
    change_log:
