# ============================================================
# RO_mockup_star_oo200rff.yml
# ============================================================
# A complete, worked instance graph conforming to RO.yml (the Genesis
# Research Object base model). Scenario: the upstream chain that turns raw
# STAR detector output into a reconstructed dataset, for the O+O
# sqrt(sNN)=200 GeV, Reversed Full Field run period already documented in
# genesis_datacard_star_ds001_oo200_rff.md -- the final ReconstructedDataset
# node below (id DS-001) IS that same dataset, so this file shows the graph
# of research objects that sit upstream of, and explain the provenance of,
# that existing data card.
#
# Covers, per the request:
#   - raw data                                  -> RawData
#   - a calibration process (a case of Analysis) -> CalibrationAnalysis
#     ...which produces...                       -> Calibration
#   - generation of a "dead channels" object     -> DeadChannelAnalysis
#     ...which produces...                       -> DeadChannelMap
#   - reconstruction, using the calibrations     -> ReconstructionAnalysis
#   - a dataset suitable for the final, high-end
#     analysis outside of this graph             -> ReconstructedDataset
#
# Two deliberate modeling choices, flagged rather than silently assumed:
#
#   1. DeadChannelMap is modeled as a Calibration (calibration_type:
#      channel_status), not a DataArtifact -- per the design discussion
#      that settled this (dead/hot-channel maps are conceptually a
#      calibration, confirmed against Ji, Zhongling's PHENIX PhD thesis,
#      Sec. 4.3 "EMCal Warn Map" / Sec. 4.4.1 "DC QA and Dead Map"). If
#      "data artifact" in the request was meant literally as the
#      DataArtifact class rather than the English phrase, this is a one-line
#      change (object_type + class) -- see the note on that record below.
#
#   2. ReconstructedDataset.used_by is deliberately left empty. The
#      "final, high-end analysis" is explicitly out of scope for this
#      graph per the request, so no forward reference to it is fabricated
#      here -- only real, declared research objects get referenced.
#
# A Software object (the STAR offline framework) is also included, shared
# by both Analysis steps, to demonstrate the point of the graph design:
# one object, described once, reused by reference rather than duplicated.
# It's one object beyond the five bullet points, added deliberately for
# that reason, not scope creep.
#
# Container note: the top-level `research_objects:` list below is just a
# convenience wrapper for bundling this demo in one file -- it is not part
# of the RO.yml schema itself. Each list entry, individually, is what
# validates against one of RO.yml's concrete classes (see validation notes
# at the end of this file).
# ============================================================
#
# Provenance-audit pass (see ResearchObjectRef.confidence/evidence/status
# in RO.yml): every uses/used_by/produces/produced_by edge below is now
# checked against genesis_datacard_star_ds001_oo200_rff.md. Two findings:
#   - The raw -> reconstruction -> DS-001 backbone, and the fact that TPC
#     calibration was performed and applied at reconstruction, are
#     documented in the datacard.
#   - The entire dead/hot-channel sub-chain (items 4-5 above) has NO
#     basis in the datacard -- it is modeled purely by analogy to a
#     different experiment's thesis (see note 1 above) and is tagged
#     confidence: inferred, status: hypothesis throughout.

research_objects:

  # ---------------------------------------------------------------
  # 1. Raw data (root node -- produced by the DAQ system, outside this graph)
  # ---------------------------------------------------------------
  - id: {type: local, value: "RAW-OO200RFF-2021"}
    object_type: Dataset
    name: "Raw DAQ data, O+O sqrt(sNN)=200 GeV, RHIC Run 21, RFF"
    description: >-
      Level 1 raw detector output (.daq files) from the STAR TPC and other
      subsystems for the O+O 200 GeV Reversed Full Field minimum-bias run
      period, prior to any calibration or reconstruction.
    version: "1.0"
    status: "Archived"
    created_date: "2021-05-16"
    updated_date: "2021-05-16"
    change_log:
      - change_date: "2021-05-16"
        summary: "Initial registration of the raw DAQ stream on HPSS tape."
    owner: "STAR Data Acquisition / SDCC Digital Repositories"
    collision_system: "O+O"
    energy: "200 GeV"
    magnetic_field_config: "Reversed Full Field (RFF)"
    access: "HPSS tape archive at SDCF, BNL"
    dataset_scale: "not_applicable in this mockup -- tracked in the STAR FileCatalog, not modeled here"
    sensitivity: "Public"
    uses: []
    used_by:
      - identifier: {type: local, value: "ANA-TPC-CAL-OO200RFF-2021"}
        role: "input to TPC gain/pedestal calibration"
        confidence: "inferred"
        evidence: >-
          DS-001 states only that TPC calibration was performed and
          applied during reconstruction; modeling the derivation as a
          discrete upstream Analysis with its own dedicated inputs is
          this mockup's own elaboration, not stated in DS-001.
      - identifier: {type: local, value: "ANA-TPC-DEADCHAN-OO200RFF-2021"}
        role: "input to dead/hot channel identification"
        confidence: "inferred"
        status: "hypothesis"
        evidence: >-
          No dead/hot channel identification step, map, or terminology
          ("dead channel", "hot channel", "channel status", "RMS") appears
          anywhere in genesis_datacard_star_ds001_oo200_rff.md. This
          object and every edge touching it are modeled by analogy to
          Ji, Zhongling's PHENIX PhD thesis Sec. 4.3/4.4.1 -- a different
          experiment's detector -- not confirmed against this dataset.
      - identifier: {type: local, value: "ANA-RECO-OO200RFF-2021-SL21C-P23IC"}
        role: "input to reconstruction"
        confidence: "documented"
        evidence: >-
          DS-001 processing_steps: raw .daq files processed through the
          STAR offline reconstruction chain using library SL21c,
          production pass P23ic, producing the Level 2 reconstructed
          MuDst dataset.
    produces: []
    produced_by: null   # root node: produced by the detector/DAQ system, outside this graph

