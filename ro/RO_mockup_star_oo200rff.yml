    object_type: Analysis
    name: "TPC dead/hot channel identification, O+O 200 GeV RFF"
    description: >-
      Identifies TPC pads that failed gain/pedestal calibration or show
      anomalous hit rates in dedicated QA runs, producing a channel-status
      map for use in reconstruction.
    version: "1.0"
    status: "Complete"
    created_date: "2021-05-23"
    updated_date: "2021-05-23"
    change_log:
      - change_date: "2021-05-23"
        summary: "Channel-status map v1 finalized."
    owner: "TPC Calibration Team (STAR)"
    objective: "Flag TPC pads that should be excluded from track reconstruction due to failed calibration or anomalous response."
    method_summary: >-
      Pads failing gain/pedestal convergence in CAL-TPC-GAINPED-OO200RFF-2021-v1,
      plus pads with hit-rate distributions more than 10x RMS from the
      sector average in dedicated QA runs, are flagged and combined into
      one channel-status map -- the same procedure described in Ji,
      Zhongling's PHENIX PhD thesis (2021), Sec. 4.3 ("EMCal Warn Map"),
      applied here to the TPC instead of the EMCal.
    published_as: []
    uses:
