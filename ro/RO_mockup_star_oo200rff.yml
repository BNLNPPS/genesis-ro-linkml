    owner: "TPC Calibration Team (STAR)"
    detector_subsystem: "TPC"
    calibration_type: "gain_pedestal"   # compound value; STAR's own DS-001 provenance text bundles "space-charge, gain-length corrections" the same way
    uses: []
    used_by:
