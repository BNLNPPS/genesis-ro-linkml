      - identifier: {type: local, value: "ANA-RECO-OO200RFF-2021-SL21C-P23IC"}
        role: "applied during reconstruction"
        confidence: "documented"
        evidence: >-
          DS-001 validation_methods: TPC calibration (space-charge,
